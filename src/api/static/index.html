<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUTRANETRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b12;
      --panel: #121826;
      --line: rgba(255,255,255,.08);
      --gold: #c9a227;
      --gold-soft: #e8d48a;
      --muted: #8b95a5;
      --text: #e8edf5;
      --blue: #3d8bfd;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", sans-serif; }
    a { color: var(--gold-soft); }
    button, select, input, textarea { font: inherit; }
    .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .side { border-right: 1px solid var(--line); padding: 1.2rem; background: #0c111b; }
    .brand { letter-spacing: .16em; color: var(--gold-soft); font-weight: 700; margin: 0; }
    .tag { color: var(--muted); font-size: .86rem; margin: .35rem 0 1.2rem; }
    label { display: block; color: var(--muted); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; margin: .8rem 0 .35rem; }
    select, input, textarea, button {
      width: 100%; border-radius: 10px; border: 1px solid var(--line);
      background: #0a0f18; color: var(--text); padding: .6rem .75rem;
    }
    button { cursor: pointer; background: #1a2436; }
    button.primary { background: var(--blue); border-color: transparent; color: #fff; font-weight: 600; }
    button.ghost { width: auto; }
    .main { padding: 1.2rem 1.5rem 2.5rem; max-width: 1320px; }
    .hero {
      display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem;
      padding: .85rem 1.15rem; margin-bottom: .85rem; border: 1px solid rgba(201,162,39,.22);
      border-radius: 16px; background: linear-gradient(135deg, rgba(18,24,38,.95), rgba(10,14,22,.88));
    }
    .hero h1 { font-size: 1.55rem; letter-spacing: .16em; color: var(--gold-soft); margin: 0; }
    .metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: .7rem; }
    .card { padding: .7rem .85rem; border-radius: 12px; background: rgba(18,24,38,.82); border: 1px solid var(--line); }
    .metric-label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
    .metric-value { font-size: 1.12rem; font-weight: 600; }
    .framing {
      padding: .65rem .9rem; margin: .7rem 0 .9rem; border-left: 3px solid var(--gold);
      background: rgba(201,162,39,.07); border-radius: 0 10px 10px 0; color: var(--muted); font-size: .84rem;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: .4rem; margin: 1rem 0; }
    .tabs button { width: auto; }
    .tabs button.on { background: rgba(201,162,39,.18); border-color: var(--gold); color: var(--gold-soft); }
    .row { display: flex; gap: .7rem; flex-wrap: wrap; align-items: end; }
    .row > * { flex: 1; min-width: 180px; }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .muted { color: var(--muted); }
    .mono { font-family: "IBM Plex Mono", monospace; font-size: .78rem; }
    .error { color: #e74c3c; }
    .quote { padding: .85rem 1rem; border-radius: 12px; background: rgba(61,139,253,.08); border: 1px solid rgba(61,139,253,.18); }
    .status-pill { display: inline-flex; align-items: center; gap: .45rem; padding: .32rem .6rem; border-radius: 999px; border: 1px solid rgba(46,204,113,.24); background: rgba(46,204,113,.08); color: #b9f6cc; font-size: .76rem; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 10px rgba(46,204,113,.65); }
    .panel { padding: .9rem 1rem; border: 1px solid var(--line); border-radius: 14px; background: rgba(18,24,38,.58); }
    .error-card { border-color: rgba(231,76,60,.28); background: rgba(231,76,60,.06); }
    .eyebrow { color: var(--gold); font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; }
    .export-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 1rem; padding: .75rem .9rem; border: 1px solid rgba(201,162,39,.18); border-radius: 12px; background: rgba(201,162,39,.05); }
    .export-links { display: flex; gap: .85rem; flex-wrap: wrap; font-family: "IBM Plex Mono", monospace; font-size: .78rem; }
    .graph-note { color: var(--muted); font-size: .78rem; margin: .55rem 0 .7rem; }
    .guide { padding: .7rem .85rem; margin: .65rem 0 .9rem; border: 1px solid rgba(61,139,253,.18); border-radius: 10px; background: rgba(61,139,253,.06); }
    .guide strong { display: block; color: var(--text); margin-bottom: .2rem; }
    .guide .muted { font-size: .8rem; line-height: 1.5; }
    .graph-legend { display: flex; flex-wrap: wrap; gap: .45rem .8rem; align-items: center; margin: .55rem 0 .15rem; font-size: .76rem; }
    .legend-label { color: var(--muted); margin-right: .15rem; }
    .legend-item { display: inline-flex; align-items: center; gap: .28rem; white-space: nowrap; }
    .swatch { width: 10px; height: 10px; display: inline-block; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,255,255,.2); }
    .edge-swatch { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
    .trail-legend { margin-top: .35rem; }
    .trail-step { display: flex; gap: .8rem; align-items: flex-start; }
    .trail-badge {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .trail-connector { width: 2px; height: 14px; margin: 0 0 0 15px; background: rgba(61,139,253,.35); }
    .exports a { margin-right: .8rem; }
    iframe.graph { width: 100%; height: 500px; border: 0; border-radius: 12px; background: #111; }
    .chat { max-width: 900px; max-height: 52vh; overflow: auto; padding-right: .2rem; }
    .bubble { margin: .6rem 0; padding: .7rem .85rem; border-radius: 12px; background: var(--panel); }
    button.primary:disabled { opacity: .65; cursor: wait; }
    .bubble.q { border: 1px solid rgba(61,139,253,.25); }
    .bubble.thinking {
      border: 1px solid rgba(61,139,253,.45);
      background: linear-gradient(90deg, rgba(61,139,253,.16), rgba(18,24,38,.9) 55%);
      animation: thinkPulse 1.4s ease-in-out infinite;
    }
    .think-row { display: flex; align-items: center; gap: .55rem; margin: .35rem 0 .15rem; }
    .think-dots { display: inline-flex; gap: .22rem; }
    .think-dots span {
      width: 7px; height: 7px; border-radius: 50%; background: #3d8bfd;
      animation: thinkDot 1s ease-in-out infinite;
    }
    .think-dots span:nth-child(2) { animation-delay: .15s; }
    .think-dots span:nth-child(3) { animation-delay: .3s; }
    .think-bar {
      display: none; margin-top: .7rem; padding: .7rem .85rem; border-radius: 12px;
      border: 1px solid rgba(61,139,253,.4); background: rgba(61,139,253,.12);
      color: #d7e6ff; font-weight: 600;
    }
    .think-bar.on { display: flex; align-items: center; gap: .65rem; }
    @keyframes thinkPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(61,139,253,.18); }
      50% { box-shadow: 0 0 0 6px rgba(61,139,253,.06); }
    }
    @keyframes thinkDot {
      0%, 80%, 100% { transform: translateY(0); opacity: .35; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <h2 class="brand">SUTRANETRA</h2>
      <p class="tag">The eye that follows the hidden threads.</p>
      <label for="case">Active case</label>
      <select id="case"></select>
      <div class="status-pill"><span class="status-dot"></span><span id="llm-status">Case review ready</span></div>
      <p class="muted" style="font-size:.8rem">Evidence-led attribution workspace</p>
      <p class="muted mono" id="health"></p>
    </aside>
    <main class="main">
      <div id="header"></div>
      <div class="tabs" id="tabs"></div>
      <section id="view"></section>
    </main>
  </div>
  <script>
    const FRAMING = "Handles, wallets, and PGP fingerprints are pseudonymous identifiers. SUTRANETRA reports correlation confidence, not an identity verdict.";
    const DEMO_PGP = "0551E07ABB21CA0F02FBFBECE8ED5F45C33DD26D";
    const VIEWS = ["Search", "Clusters", "Pair inspector", "Evidence Trail", "OpSec", "Investigator"];
    const TONE = {
      alias: ["◆", "#c9a227"], post: ["▸", "#3d8bfd"], evidence: ["⬡", "#2ecc71"],
      score: ["◎", "#e8d48a"], opsec: ["⚠", "#e74c3c"], ct_cert: ["▣", "#9b59b6"], ct_domain: ["↗", "#e67e22"],
    };
    const state = { cases: [], case: null, view: "Search", aliases: [], clusters: [], health: null, chat: [] };
    const API_BASE = window.location.protocol === "file:" ? "http://127.0.0.1:8000" : "";
    const apiUrl = (path) => `${API_BASE}${path}`;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
    const fmt = (n) => (n == null || n === "" ? "—" : Number(n).toLocaleString());
    const num = (n, d = 3) => (n == null || n === "" ? "—" : Number(n).toFixed(d));
    const MARKET_COLORS = [
      ["silkroad1", "#c9a227"], ["silkroad2", "#3d8bfd"], ["thehub", "#2ecc71"],
      ["nucleus", "#e67e22"], ["cannabisroad3", "#9b59b6"],
    ];
    const guide = (title, body) => `<div class="guide"><strong>${title}</strong><div class="muted">${body}</div></div>`;
    const graphLegend = () => `<div class="graph-legend">
      <span class="legend-label">Graph key:</span>
      ${MARKET_COLORS.map(([market, color]) => `<span class="legend-item"><i class="swatch" style="background:${color}"></i>${market} node</span>`).join("")}
      <span class="legend-item"><i class="edge-swatch" style="background:#d35400"></i>cross-market edge</span>
      <span class="legend-item"><i class="edge-swatch" style="background:#5d6d7e"></i>same-market edge</span>
    </div>`;
    const trailLegend = () => `<div class="graph-legend trail-legend">
      <span class="legend-label">Trail key:</span>
      <span class="legend-item" style="color:#c9a227">◆ alias</span><span class="legend-item" style="color:#3d8bfd">▸ post</span>
      <span class="legend-item" style="color:#2ecc71">⬡ evidence</span><span class="legend-item" style="color:#e8d48a">◎ score</span>
      <span class="legend-item" style="color:#e74c3c">⚠ OpSec</span><span class="legend-item" style="color:#9b59b6">▣ CT certificate</span>
      <span class="legend-item" style="color:#e67e22">↗ CT sibling</span>
    </div>`;

    async function api(path, opts) {
      try {
        const r = await fetch(apiUrl(path), opts);
        if (!r.ok) throw new Error(`${r.status} ${path}`);
        const ct = r.headers.get("content-type") || "";
        return ct.includes("application/json") ? r.json() : r.text();
      } catch (err) {
        if (err instanceof TypeError) {
          throw new Error(`The local SUTRANETRA service is unavailable at ${apiUrl("/")}.`);
        }
        throw err;
      }
    }

    function table(rows, keys) {
      if (!rows || !rows.length) return `<p class="muted">None.</p>`;
      const cols = keys || Object.keys(rows[0]);
      return `<div style="overflow:auto"><table><thead><tr>${cols.map((k) => `<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>${
        rows.map((row) => `<tr>${cols.map((k) => `<td class="mono">${esc(Array.isArray(row[k]) ? row[k].join(", ") : row[k])}</td>`).join("")}</tr>`).join("")
      }</tbody></table></div>`;
    }

    function renderHeader() {
      const c = state.case || {};
      const snap = c.corpus_snapshot || {};
      $("header").innerHTML = `
        <div class="hero">
          <div>
            <div class="eyebrow">Case file / active investigation</div>
            <h1>SUTRANETRA</h1>
            <p class="tag" style="margin:0.15rem 0 0">The eye that follows the hidden threads.</p>
          </div>
          <div style="text-align:right"><div class="status-pill"><span class="status-dot"></span>${esc(state.health?.llm?.reachable ? "Groq phrasing online" : "Case review ready")}</div><div class="muted" style="margin-top:.45rem">case ${esc(c.case_id)} · ${esc(c.status)}</div></div>
        </div>
        <div class="metrics">
          <div class="card"><div class="metric-label">Threshold</div><div class="metric-value">${esc(c.threshold)}</div></div>
          <div class="card"><div class="metric-label">Model</div><div class="metric-value" style="font-size:.92rem">${esc(c.model_version)}</div></div>
          <div class="card"><div class="metric-label">Corpus</div><div class="metric-value">${fmt(snap.n_posts)} posts</div></div>
          <div class="card"><div class="metric-label">Aliases</div><div class="metric-value">${fmt(snap.n_aliases)}</div></div>
          <div class="card"><div class="metric-label">Markets</div><div class="metric-value">${(snap.markets || []).length}</div></div>
        </div>
        <div class="framing">${esc(FRAMING)}</div>
        <p class="muted mono">config ${esc((c.config_hash || "").slice(0, 12))}… · ${esc((snap.markets || []).join(", "))}</p>
      `;
      $("tabs").innerHTML = VIEWS.map((v) => `<button data-view="${v}" class="${v === state.view ? "on" : ""}">${v}</button>`).join("");
      $("tabs").onclick = (e) => {
        const v = e.target.dataset.view;
        if (!v) return;
        state.view = v;
        renderHeader();
        renderView();
      };
    }

    function exports() {
      const id = state.case.case_id;
      return `<div class="export-bar"><div><strong>Case exports</strong><div class="muted" style="font-size:.78rem">Stable, case-scoped evidence files</div></div><div class="export-links">
        <a href="${apiUrl(`/cases/${id}/export/csv`)}">clusters.csv</a>
        <a href="${apiUrl(`/cases/${id}/export/json`)}">report.json</a>
        <a href="${apiUrl(`/cases/${id}/export/pdf`)}">report.pdf</a>
      </div></div>`;
    }

    async function renderView() {
      const view = $("view");
      view.innerHTML = `<p class="muted">Loading…</p>`;
      const id = state.case.case_id;
      try {
        if (state.view === "Search") return renderSearch(view, id);
        if (state.view === "Clusters") return renderClusters(view, id);
        if (state.view === "Pair inspector") return renderPair(view, id);
        if (state.view === "Evidence Trail") return renderTrail(view, id);
        if (state.view === "OpSec") return renderOpsec(view, id);
        return renderInvestigator(view, id);
      } catch (err) {
        view.innerHTML = `<p class="error">${esc(err.message)}</p>`;
      }
    }

    function renderSearch(view, id) {
      view.innerHTML = `
        <h3>Evidence search</h3>
        ${guide("What this page tells you", "Searches the stored corpus for a handle, wallet, PGP fingerprint, onion address, or domain. Every result keeps its source archive, scrape date, member path, and content hash so a judge can see where it came from. A hit is an investigative lead, not an identity verdict.")}
        <p class="muted">Full-text over extracted evidence and posts, with archive-member lineage.</p>
        <div class="row">
          <div><label>Query</label><input id="q" placeholder="PGP fingerprint, BTC address, onion, or handle" /></div>
        </div>
        <div class="row" style="margin:.7rem 0">
          <button class="ghost" id="demo">Load example PGP fingerprint</button>
          <button class="primary" id="go">Search</button>
        </div>
        <div id="hits"></div>
        ${exports()}
      `;
      const run = async () => {
        const q = $("q").value.trim();
        if (!q) { $("hits").innerHTML = `<p class="muted">Search a handle, wallet, PGP fingerprint, onion, or clearnet domain.</p>`; return; }
        $("hits").innerHTML = `<p class="muted">Searching…</p>`;
        const rows = await api(`/cases/${id}/search?q=${encodeURIComponent(q)}`);
        $("hits").innerHTML = `<p>${rows.length} hits</p>` + table(rows, ["hit_type", "kind", "market", "alias", "value", "source_archive", "scrape_date", "source_member_path", "content_sha256"]);
      };
      $("demo").onclick = () => { $("q").value = DEMO_PGP; run(); };
      $("go").onclick = run;
      $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
    }

    async function renderClusters(view, id) {
      const clusters = await api(`/cases/${id}/clusters`);
      state.clusters = clusters;
      if (!clusters.length) {
        view.innerHTML = `<div class="panel"><div class="eyebrow">Graph stage</div><h3>Graph not available yet</h3><p class="muted">Case ${esc(state.case?.case_id || id)} is ${esc(state.case?.status || "not ready")}. Run the graph stage before opening cluster review.</p></div>${exports()}`;
        return;
      }
      const multi = clusters.filter((c) => c.n_markets >= 3);
      const preferred = multi.sort((a, b) => a.n_members - b.n_members || b.confidence - a.confidence)[0] || clusters[0];
      view.innerHTML = `
        <h3>Actor clusters</h3>
        ${guide("How to read this page", `${clusters.length} clusters means ${clusters.length} connected components in the thresholded pair graph—not ${clusters.length} confirmed people. ${multi.length} components contain aliases from three or more markets. The selected score is the strongest stored pair confidence in that component; it is not a probability of identity.`)}
        <p class="muted">The recommended demo cluster is preselected because it is cross-market and concise. Larger clusters are valid, but intentionally denser.</p>
        <label>Select cluster</label>
        <select id="cluster">${clusters.map((c) =>
          `<option value="${c.cluster_id}" ${c.cluster_id === preferred?.cluster_id ? "selected" : ""}>#${c.cluster_id} · ${c.n_members} aliases · ${c.n_markets} markets · max score ${Number(c.confidence).toFixed(2)}</option>`
        ).join("")}</select>
        <div id="cdetail" style="margin-top:1rem"></div>
        ${exports()}
      `;
      const load = async () => {
        const cid = $("cluster").value;
        $("cdetail").innerHTML = `<p class="muted">Loading cluster ${esc(cid)}…</p>`;
        const p = await api(`/cases/${id}/clusters/${cid}`);
        const dense = (p.members || []).length > 80
          ? guide("Why this graph looks dense", `Cluster #${esc(cid)} is a valid large connected component with ${(p.members || []).length} aliases. The circular layout keeps every member visible, so many thin lines are expected. For the clearest judge walkthrough, use the preselected recommended cluster #${esc(preferred?.cluster_id)}.`)
          : "";
        $("cdetail").innerHTML = `
          ${dense}<div class="panel"><div class="eyebrow">Relationship map</div><h4 style="margin:.25rem 0 0">Cluster graph</h4><div class="graph-note">Each circle is a pseudonymous alias. Its colour identifies the marketplace. A line is a stored pair score at or above the case threshold (${esc(state.case?.threshold)}); its thickness highlights cross-market links. Hover a node or line for the exact label and score; use the navigation controls, wheel, and drag to explore.</div>${graphLegend()}<iframe class="graph" title="cluster graph"></iframe></div>
          <div class="row" style="margin-top:1rem"><div class="panel"><h4>Members</h4><p class="muted">The aliases represented by this connected component.</p>${table(p.members)}</div><div class="panel"><h4>Shared evidence with lineage</h4><p class="muted">Identifiers observed for more than one member, with the source record that carried them.</p>${table(p.shared)}</div></div>
        `;
        const frame = $("cdetail").querySelector("iframe");
        frame.srcdoc = p.graph_html || "<p style='color:#8b95a5;padding:1rem;font-family:sans-serif'>No graph.</p>";
      };
      $("cluster").onchange = load;
      if (preferred) load();
    }

    async function renderPair(view, id) {
      const aliases = await api(`/cases/${id}/aliases`);
      state.aliases = aliases;
      const a0 = aliases.find((a) => a.label.endsWith(":NW Nugz")) || aliases[0];
      const b0 = aliases.find((a) => a.label.endsWith(":nw nugz")) || aliases[1];
      const opts = (sel) => aliases.map((a) => `<option value="${a.alias_id}" ${a.alias_id === sel?.alias_id ? "selected" : ""}>${esc(a.label)}</option>`).join("");
      view.innerHTML = `
        <h3>Pair inspector</h3>
        ${guide("What this page tells you", "Score meanings: S_char = writing-style similarity from character patterns. S_embed = topic or semantic similarity, not writing style. S_hard = shared extracted evidence such as a PGP fingerprint or wallet. S_time = similarity in activity timing; a dash means there was not enough timestamped data. Confidence is the learned fusion score used for graph links, not an identity verdict.")}
        <div class="row">
          <div><label>Alias A</label><select id="a">${opts(a0)}</select></div>
          <div><label>Alias B</label><select id="b">${opts(b0)}</select></div>
        </div>
        <div id="pdetail" style="margin-top:1rem"></div>
        ${exports()}
      `;
      const load = async () => {
        const a = $("a").value, b = $("b").value;
        $("pdetail").innerHTML = `<p class="muted">Scoring pair…</p>`;
        const p = await api(`/cases/${id}/pairs?a_alias_id=${a}&b_alias_id=${b}`);
        const s = p.scores || {};
        $("pdetail").innerHTML = `
          <div class="metrics">
            <div class="card"><div class="metric-label">S_char</div><div class="metric-value">${num(s.s_char)}</div></div>
            <div class="card"><div class="metric-label">S_embed</div><div class="metric-value">${num(s.s_embed)}</div></div>
            <div class="card"><div class="metric-label">S_hard</div><div class="metric-value">${num(s.s_hard)}</div></div>
            <div class="card"><div class="metric-label">S_time</div><div class="metric-value">${s.s_time == null ? "—" : num(s.s_time)}</div></div>
            <div class="card"><div class="metric-label">Confidence</div><div class="metric-value">${num(s.confidence)}</div></div>
          </div>
          <h4>Generated explanation</h4>
          <div class="quote">${esc(p.sentence)}</div>
          <h4>Shared evidence with post context and lineage</h4>
          ${table(p.detail)}
        `;
      };
      $("a").onchange = load;
      $("b").onchange = load;
      load();
    }

    async function renderTrail(view, id) {
      if (!state.clusters.length) state.clusters = await api(`/cases/${id}/clusters`);
      if (!state.clusters.length) {
        view.innerHTML = `<div class="panel"><div class="eyebrow">Evidence Trail</div><h3>Trail not available yet</h3><p class="muted">This case has no computed graph clusters. Run the graph stage before opening the evidence trail.</p></div>${exports()}`;
        return;
      }
      const multi = state.clusters.filter((c) => c.n_markets >= 3);
      const preferred = multi.sort((a, b) => a.n_members - b.n_members || b.confidence - a.confidence)[0] || state.clusters[0];
      view.innerHTML = `
        <h3>Evidence Trail</h3>
        ${guide("What this page tells you", "This is the ordered, deterministic chain behind a result: alias → source post → extracted evidence → second alias → fused score → any observed OpSec or Certificate Transparency step. The trail reads only stored rows; if a step was not observed, it is left out.")}
        ${trailLegend()}
        <label>Cluster</label>
        <select id="tcluster">${state.clusters.map((c) =>
          `<option value="${c.cluster_id}" ${c.cluster_id === preferred?.cluster_id ? "selected" : ""}>#${c.cluster_id} · ${c.n_members} aliases</option>`
        ).join("")}</select>
        <div id="tdetail" style="margin-top:1rem"></div>
        ${exports()}
      `;
      const load = async () => {
        const cid = $("tcluster").value;
        const steps = await api(`/cases/${id}/trail?cluster_id=${cid}`);
        $("tdetail").innerHTML = steps.map((step, i) => {
          const [icon, color] = TONE[step.type] || ["•", "#8b95a5"];
          const meta = step.type === "post"
            ? `<div class="muted mono">${esc(step.source_archive)} / ${esc(step.scrape_date)} / ${esc(step.source_member_path)}<br>sha256 ${esc(step.content_sha256)}</div>`
            : "";
          const conn = i < steps.length - 1 ? `<div class="trail-connector"></div>` : "";
          return `<div class="trail-step"><div class="trail-badge" style="color:${color};border:1px solid ${color}33;background:${color}22">${icon}</div>
            <div><div class="mono" style="color:${color};letter-spacing:.12em;text-transform:uppercase;font-size:.66rem">${esc(step.type)}</div>
            <div>${esc(step.label)}</div>${meta}</div></div>${conn}`;
        }).join("") || `<p class="muted">No trail.</p>`;
      };
      $("tcluster").onchange = load;
      if (preferred) load();
    }

    async function renderOpsec(view, id) {
      const findings = await api(`/cases/${id}/opsec`);
      const sibs = findings.filter((f) => f.finding_kind === "ct_sibling").map((f) => f.value);
      view.innerHTML = `
        <h3>OpSec findings</h3>
        ${guide("What this page tells you", "Shows infrastructure observations from the team-owned localhost demonstration target and cached Certificate Transparency pivots. These are technical leads to investigate next; they do not prove who controls an alias or domain.")}
        <p class="muted">Stored results from the localhost demo scan. Live scanning stays on the CLI / local tools.</p>
        <p>${findings.length} rows</p>
        ${table(findings, ["finding_kind", "value", "target", "detail", "created_at"])}
        ${sibs.length ? `<h4>CT sibling domains</h4><p class="mono">${esc(sibs.slice(0, 12).join(", "))}</p>` : ""}
        ${exports()}
      `;
    }

    function thinkingDots() {
      return `<span class="think-dots" aria-hidden="true"><span></span><span></span><span></span></span>`;
    }

    function setThinking(on, elapsed = 0) {
      const bar = $("think-bar");
      const ask = $("ask");
      const q = $("question");
      if (bar) {
        bar.classList.toggle("on", on);
        bar.innerHTML = on
          ? `${thinkingDots()}<span>Thinking… Groq is reading stored evidence (${elapsed}s)</span>`
          : "";
      }
      if (ask) {
        ask.disabled = on;
        ask.textContent = on ? "Thinking…" : "Ask";
      }
      if (q) q.disabled = on;
    }

    function paintChat() {
      const chat = $("chat");
      if (!chat) return;
      const elapsed = state.askStarted ? Math.max(0, Math.floor((Date.now() - state.askStarted) / 1000)) : 0;
      chat.innerHTML = state.chat.map((m) => {
        if (m.role === "you") return `<div class="bubble q"><strong>You</strong><div>${esc(m.text)}</div></div>`;
        if (m.role === "pending") return `<div class="bubble thinking" role="status" aria-live="polite">
          <div class="think-row">${thinkingDots()}<strong>SUTRANETRA is thinking</strong></div>
          <div>Looking up stored case facts. Reply will appear here — usually a few seconds.</div>
          <div class="muted" style="margin-top:.35rem">${elapsed}s elapsed</div>
        </div>`;
        if (m.role === "error") return `<div class="bubble error">${esc(m.text)}</div>`;
        return `<div class="bubble"><strong>SUTRANETRA</strong> <span class="muted">${esc(m.model || "")}</span><div>${rich(m.text)}</div></div>`;
      }).join("");
      chat.scrollTop = chat.scrollHeight;
      setThinking(!!state.asking, elapsed);
    }

    function renderInvestigator(view, id) {
      view.innerHTML = `
        <h3>Investigator</h3>
        ${guide("What this page tells you", "Ask a question in plain English about the active case. Groq phrases facts already stored by SUTRANETRA; it does not score aliases, change the database, or issue an identity verdict. Use the other tabs and provenance rows to verify the answer.")}
        <p class="muted">Natural-language query over stored results. After you click Ask, a thinking state stays on screen until Groq answers. The model does not score aliases and does not issue identity verdicts.</p>
        <div class="chat" id="chat"></div>
        <label>Question</label>
        <textarea id="question" rows="3" placeholder="Walk me through the evidence trail for this cluster…"></textarea>
        <button class="primary" id="ask" style="margin-top:.7rem">Ask</button>
        <div class="think-bar" id="think-bar"></div>
      `;
      paintChat();
      const send = async () => {
        const question = $("question").value.trim();
        if (!question || state.asking) return;
        state.asking = true;
        state.askStarted = Date.now();
        $("question").value = "";
        state.chat.push({ role: "you", text: question });
        state.chat.push({ role: "pending", text: "" });
        paintChat();
        const tick = setInterval(paintChat, 400);
        try {
          const ans = await api("/agent/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ case_id: id, question }),
          });
          state.chat = state.chat.filter((m) => m.role !== "pending");
          const text = ans.degraded
            ? (ans.text || "Live phrasing is unavailable for this session. Open Evidence Trail to read the stored steps without Groq.")
            : (ans.text || "Groq returned an empty reply. Open Evidence Trail for the stored walkthrough.");
          state.chat.push({ role: "bot", text, model: ans.model || "" });
        } catch (err) {
          state.chat = state.chat.filter((m) => m.role !== "pending");
          state.chat.push({ role: "error", text: err.message });
        } finally {
          clearInterval(tick);
          state.asking = false;
          state.askStarted = 0;
          paintChat();
        }
      };
      $("ask").onclick = send;
      $("question").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send();
      });
    }

    async function boot() {
      const h = await api("/health");
      state.health = h;
      $("health").textContent = `profile ${h.profile} · db ${h.db_exists ? "ready" : "missing"}`;
      $("llm-status").textContent = h.llm?.reachable ? "Groq phrasing online" : "Case review ready";
      state.cases = await api("/cases");
      const sel = $("case");
      sel.innerHTML = state.cases.map((c) => `<option value="${esc(c.case_id)}">${esc(c.case_id)} · ${esc(c.status)}</option>`).join("");
      const first = state.cases.find((c) => c.case_id === "CASE-2026-001") || state.cases[0];
      sel.value = first.case_id;
      const loadCase = async () => {
        state.case = await api(`/cases/${sel.value}`);
        state.clusters = [];
        renderHeader();
        renderView();
      };
      sel.onchange = loadCase;
      await loadCase();
    }
    boot().catch((err) => {
      $("view").innerHTML = `<div class="panel error-card"><div class="eyebrow">Local service</div><h3>Connect to the SUTRANETRA API</h3><p class="error">${esc(err.message)}</p><p class="muted">Start the local API, then reload this page. The file view now targets the same local service automatically.</p><a href="${apiUrl("/")}">Open the local judge UI</a></div>`;
    });
  </script>
</body>
</html>
