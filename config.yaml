# SUTRANETRA — default profile is dev (no Neo4j, no LLM polish required).
# Override: SUTRANETRA_PROFILE=demo|cloud. Cloud is the public judge path.
# Community Edition 2026.07.1: CREATE USER works; GRANT ROLE reader does not
# (UnsupportedAdministrationCommand). Reader access is a no-write code path,
# not an enforced DB role. Password via NEO4J_PASSWORD, never committed.
profile: dev

paths:
  data_raw: data/raw
  sqlite_db: data/db/attrib.sqlite
  ct_cache: data/cache/ct

# Primary five (SPEC.md §22: five markets is plenty). Agora/Evolution
# deferred: volume/overlap only; at ~14 pages/sec they are ~17h combined.
markets:
  - cannabisroad3
  - nucleus
  - silkroad1
  - silkroad2
  - thehub

# Skipped for Prompt 02 (archives already on disk; ingest later if unique
# posts are well under 1M). Reasons go in docs/build-log.md.
skipped_markets:
  agora: throughput — extra volume/overlap already covered by SR2 + TheHub
  evolution: throughput — same; lowest unique signal vs hours of parse time

fusion:
  confidence_threshold: 0.83

stylometry:
  char_ngram_min_df: 3
  char_ngram_max_features: 200000
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  blocking_top_k: 50
  blocking_svd_dims: 256
  embed_max_posts: 200
  embed_batch_size: 64

# Shared model name. Profiles override provider + model.
# Groq free-tier catalog (2026-09) no longer lists llama-3.3-70b-versatile;
# openai/gpt-oss-20b is the local/cloud Groq chat model that this key can call.
llm_model: openai/gpt-oss-20b

profiles:
  dev:
    neo4j:
      enabled: false
      uri: bolt://localhost:7687
      user: neo4j
      password: ""
      database: neo4j
    llm:
      # yaml default off (pipeline CLI). Local UI: SUTRANETRA_LLM_ENABLED=1 + GROQ_API_KEY.
      enabled: false
      provider: groq
      model: openai/gpt-oss-20b

  demo:
    neo4j:
      enabled: true
      uri: bolt://localhost:7687
      user: neo4j
      password: ""
      database: neo4j
      reader_user: sutranetra_reader
      reader_password: ""
    llm:
      enabled: true
      provider: ollama
      model: qwen2.5:7b

  cloud:
    neo4j:
      enabled: false
      uri: bolt://localhost:7687
      user: neo4j
      password: ""
      database: neo4j
    llm:
      enabled: true
      provider: groq
      model: openai/gpt-oss-20b
    api_base_url: ""  # set SUTRANETRA_API_URL in Streamlit secrets
